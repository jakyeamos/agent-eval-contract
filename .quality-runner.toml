[[quality_runner.gates]]
id = "security_dependency_audit"
command = "uv export --frozen --format requirements.txt --no-dev --no-emit-project | uv run --with pip-audit pip-audit -r /dev/stdin --strict --disable-pip --no-deps"
ecosystem = "python"
source = "uv.lock"
owner = "platform"
required = true
severity = "blocker"

[[quality_runner.gates]]
id = "environment_contract"
command = "python3 scripts/check_environment_contract.py"
ecosystem = "python"
source = "scripts/check_environment_contract.py"
owner = "repository"
required = true
severity = "blocker"
mutating_risk = "safe"

[quality_runner]
default_profile = "default"
required_capabilities = ["formatter", "lint", "typecheck", "tests", "build", "dead_code", "runtime_smoke", "pre_pr", "pre_cr"]
